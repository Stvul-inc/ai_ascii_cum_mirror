<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII Mirror Pro — iPhone Studio Camera</title>
    <meta name="description" content="Полноценная камера iPhone в формате ASCII-арта: Портрет, Квадрат 1:1, Фото 4:3, Кино 16:9, Зум и Таймер">
    <link rel="stylesheet" href="style.css?v=4.1">
</head>
<body>
    <div id="app-container">
        <!-- Верхний статус-бар (macOS Window Header) -->
        <header id="mac-header">
            <div class="header-left">
                <div class="traffic-lights">
                    <span class="light close"></span>
                    <span class="light minimize"></span>
                    <span class="light zoom"></span>
                </div>
                <div class="live-badge">
                    <span class="pulse-dot"></span>
                    <span class="badge-text">LIVE</span>
                </div>
                <span class="header-divider"></span>
                <h1 class="app-title">Camera Studio</h1>
            </div>

            <!-- Верхние быстрые тумблеры iPhone (Таймер, Сетка 3x3, Зеркало) -->
            <div class="header-center">
                <div class="top-controls">
                    <div class="engine-selector" id="engine-selector">
                        <button class="engine-btn active" data-engine="webgl" title="Аппаратный GPU рендеринг (60+ FPS)">⚡️ GPU</button>
                        <button class="engine-btn" data-engine="svg" title="Реальный векторный SVG рендеринг">📐 SVG</button>
                    </div>
                    <button id="btn-timer" class="top-icon-btn" title="Таймер спуска (T)">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                        <span id="timer-label">ВЫКЛ</span>
                    </button>
                    <button id="btn-grid-toggle" class="top-icon-btn" title="Сетка третей 3×3 (G)">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/></svg>
                        <span>Сетка</span>
                    </button>
                    <button id="btn-mirror" class="top-icon-btn active" title="Зеркало селфи (M)">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m16 3 4 4-4 4"/><path d="M20 7H4"/><path d="m8 21-4-4 4-4"/><path d="M4 17h16"/></svg>
                        <span>Зеркало</span>
                    </button>
                </div>
            </div>

            <div class="header-right">
                <button id="btn-vcam-toggle" class="top-icon-btn vcam-toggle-btn" title="Трансляция в системную виртуальную камеру macOS">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
                    <span id="vcam-label">Вирткамера</span>
                </button>
                <a id="btn-clean-cam" href="?mode=cam" target="_blank" class="top-icon-btn" title="Открыть чистый видеопоток для OBS Studio / захвата">
                    <span>OBS</span>
                </a>
                <button id="btn-adhd-toggle" class="top-icon-btn adhd-toggle-btn" title="Режим СДВГ / Brainrot (игры, залипалово, реклама)">
                    <span>🧠 СДВГ</span>
                </button>
                <div class="stat-badge" id="format-badge">КВАДРАТ 1:1</div>
                <div class="stat-badge" id="resolution-badge">100 × 100</div>
                <div class="stat-badge fps" id="fps-counter">60 FPS</div>
                <button id="btn-fullscreen" class="icon-btn" title="Полноэкранный режим (F)">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
                </button>
            </div>
        </header>

        <!-- Основная сцена с опциональными боковыми СДВГ-панелями -->
        <div id="main-stage">
            <!-- Левая панель: Браузерные ретро-игры -->
            <aside id="adhd-left-panel" class="adhd-panel hidden">
                <div class="adhd-panel-header">
                    <span>🎮 Игры от скуки</span>
                    <span id="flappy-score-badge" class="adhd-badge">Счёт: 0</span>
                </div>
                <div class="adhd-game-wrapper">
                    <canvas id="flappy-canvas" width="220" height="320"></canvas>
                    <div id="flappy-overlay" class="flappy-ui">
                        <span id="flappy-msg">Клик для прыжка</span>
                    </div>
                </div>
                <div class="adhd-panel-footer">
                    <button id="btn-flappy-restart" class="adhd-btn">Заново</button>
                </div>
            </aside>

            <!-- Центральная область холста (Адаптивный вьюпорт камеры) -->
            <main id="viewport-container">
                <div id="canvas-wrapper">
                    <canvas id="ascii-canvas"></canvas>
                    <svg id="ascii-svg" class="hidden" xmlns="http://www.w3.org/2000/svg"></svg>

                <!-- Сетка третей 3x3 iPhone -->
                <div id="camera-grid" class="hidden">
                    <div class="grid-line h1"></div>
                    <div class="grid-line h2"></div>
                    <div class="grid-line v1"></div>
                    <div class="grid-line v2"></div>
                </div>

                <!-- Виньетка режима ПОРТРЕТ -->
                <div id="portrait-vignette" class="hidden"></div>

                <!-- Зум бейдж на экране iPhone -->
                <div id="zoom-hud">
                    <div class="zoom-selector">
                        <button class="zoom-btn" data-zoom="0.5">0.5x</button>
                        <button class="zoom-btn active" data-zoom="1.0">1x</button>
                        <button class="zoom-btn" data-zoom="2.0">2x</button>
                    </div>
                </div>

                <!-- Обратный отсчёт таймера -->
                <div id="countdown-overlay" class="hidden">
                    <span id="countdown-number">3</span>
                </div>

                <!-- Оверлей паузы -->
                <div id="pause-overlay" class="hidden">
                    <div class="pause-badge">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
                        <span>ПАУЗА</span>
                    </div>
                </div>

                <!-- Вспышка затвора Apple Camera -->
                <div id="flash-overlay"></div>
            </div>
            </main>

            <!-- Правая панель: СДВГ-залипалово (шарики и туннель) -->
            <aside id="adhd-right-panel" class="adhd-panel hidden">
                <div class="adhd-panel-header">
                    <span>🌀 СДВГ Залипалово</span>
                    <div class="satisfy-selector">
                        <button class="satisfy-btn active" data-satisfy="balls">Шары</button>
                        <button class="satisfy-btn" data-satisfy="tunnel">3D</button>
                    </div>
                </div>
                <div class="adhd-canvas-wrapper">
                    <canvas id="satisfy-canvas" width="220" height="320"></canvas>
                </div>
                <div class="adhd-panel-footer">
                    <span class="adhd-hint">💡 Води курсором по холсту</span>
                </div>
            </aside>
        </div>

        <!-- Режимы съёмки iPhone (Карусель форматов) -->
        <div id="camera-modes-bar">
            <div class="modes-track" id="format-selector">
                <button class="mode-item" data-format="pano">ПАНОРАМА</button>
                <button class="mode-item" data-format="16_9">16 : 9</button>
                <button class="mode-item" data-format="photo">ФОТО</button>
                <button class="mode-item" data-format="portrait">ПОРТРЕТ</button>
                <button class="mode-item active" data-format="square">КВАДРАТ</button>
            </div>
        </div>

        <!-- Нижний стеклянный плавающий док управления -->
        <footer id="floating-dock">
            <div class="dock-inner">
                <!-- Селектор палитр -->
                <div class="dock-group">
                    <div class="segmented-control" id="color-palette-selector">
                        <button class="seg-btn active" data-mode="pixel" title="Натуральные цвета камеры">🌈 RGB</button>
                        <button class="seg-btn" data-mode="neon" title="Кибернетический неон">🔮 Неон</button>
                        <button class="seg-btn" data-mode="matrix" title="Терминал Матрица">💚 Матрица</button>
                        <button class="seg-btn" data-mode="silver" title="Монохром Apple">⚪ Ч/Б</button>
                        <button class="seg-btn" data-mode="amber" title="Винтажный янтарь">🌅 Янтарь</button>
                        <button class="seg-btn" data-mode="invert" title="Инверсия цветов">🔲 Негатив</button>
                    </div>
                </div>

                <div class="dock-separator"></div>

                <!-- Ползунки разрешения и контраста -->
                <div class="dock-group controls-group">
                    <div class="control-item">
                        <label for="resolution-slider">Разрешение <span id="resolution-val">100</span></label>
                        <input type="range" id="resolution-slider" min="10" max="360" value="100" step="1" title="Шкала разрешения сетки (10 - 360)">
                    </div>
                    <div class="control-item">
                        <label for="contrast-slider">Контраст <span id="contrast-val">1.0</span></label>
                        <input type="range" id="contrast-slider" min="0.5" max="2.0" value="1.0" step="0.1" title="Регулировка контраста">
                    </div>
                </div>

                <div class="dock-separator"></div>

                <!-- Действия камеры: Кнопка затвора Apple Shutter, Копирование, Пауза -->
                <div class="dock-group actions-group">
                    <button id="btn-pause" class="dock-btn" title="Пауза / Пуск (Space/P)">
                        <svg class="icon-pause" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
                        <span id="pause-btn-text">Пауза</span>
                    </button>

                    <button id="btn-copy" class="dock-btn highlight" title="Скопировать текстовый ASCII в буфер (C)">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                        <span>Текст</span>
                    </button>

                    <!-- Выбор формата снимка: PNG, SVG, PDF -->
                    <div class="export-format-selector" id="export-format-selector" title="Формат сохранения снимка">
                        <button class="export-btn active" data-export="png">PNG</button>
                        <button class="export-btn" data-export="svg">SVG</button>
                        <button class="export-btn" data-export="pdf">PDF</button>
                    </div>

                    <!-- Фирменная круглая кнопка спуска затвора iPhone -->
                    <button id="btn-shutter" class="apple-shutter" title="Сделать снимок (S/Enter)">
                        <span class="shutter-inner"></span>
                    </button>
                </div>
            </div>
        </footer>

        <!-- Toast уведомления -->
        <div id="toast" class="hidden">
            <span id="toast-icon">✓</span>
            <span id="toast-message">Снимок сохранён</span>
        </div>

        <!-- Оверлей вирусных скам-баннеров и объявлений (СДВГ-режим) -->
        <div id="scam-overlay" class="hidden"></div>
    </div>

    <!-- Скрытые элементы камеры -->
    <video id="webcam-video" playsinline autoplay muted style="display: none;"></video>
    <canvas id="offscreen-canvas" style="display: none;"></canvas>

    <script src="app.js?v=4.1"></script>
</body>
</html>
